[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sedei-enterprise-integration"
version = "0.1.0"
description = "Companion implementation of a secure event-driven enterprise integration architecture (API gateway, orchestration, durable events, telemetry, hybrid detection, contextual risk, adaptive response)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Partha Chakraborty" }]
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.5",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
sedei = "sedei.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sedei = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["sedei"]
omit = ["*/sedei/__main__.py"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"src/sedei/report.py" = ["E501"]  # generated markdown tables
"src/sedei/cli.py" = ["E501"]
"tests/*" = ["E501"]
